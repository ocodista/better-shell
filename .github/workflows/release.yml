name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: better-shell-linux-x64
            apt: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: better-shell-linux-x64-musl
            apt: musl-tools
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: better-shell-linux-arm64
            apt: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: better-shell-linux-arm64-musl
            apt: musl-tools
          - os: macos-14
            target: aarch64-apple-darwin
            asset: better-shell-darwin-arm64
            apt: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: better-shell-darwin-x64
            apt: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: better-shell-windows-x64.exe
            apt: ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux' && matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Package release artifact
        shell: bash
        run: ./scripts/package-release.sh '${{ matrix.target }}' '${{ matrix.asset }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
