[package]
name = "better-shell-rust"
version = "0.2.0"
edition = "2024"
description = "Rust implementation of Better Shell CLI for size and startup comparisons"
license = "MIT"
publish = false

[dependencies]
dialoguer = "0.11"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
